name: "Update brotli"
"on":
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  eval:
    runs-on: [bigger-parallel, native-x86_64-linux]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-home@24f381c90fb24e9f090418dbce83d326b014f4ef # v1
        with:
          gpg-privkey: ${{ secrets.GPG_PRIVKEY }}
          gpg-key-id: ${{ vars.GPG_KEY_ID }}
      - name: update package
        run: |
          base="master"
          head="ci-update-package"

          git checkout -B "$head" "origin/$base" || git checkout -b "$head"

          old_version=$(nix eval --raw ".#brotli-dec.version")
          nix run --inputs-from . nixpkgs#nix-update -- -F brotli-dec --commit --version=branch=master

          if [[ "$(git rev-list origin/"$base"..HEAD --count)" -ne 1 ]]; then
            echo "No changes for ${{ matrix.attrPath }}"
            exit 0
          fi

          git push origin "$head" --force

          existing_prs="$(
            curl --silent --fail-with-body \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/pulls?state=open"
          )"

          if jq -e --arg head "$head" 'any(.[]; .head.ref == $head)' <<< "$existing_prs" > /dev/null; then
            echo "PR for branch '$head' already exists"
            exit 0
          fi

          title="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"

          new_version=$(nix eval --raw ".#brotli-dec.version")
          body="Automated version bump for **brotli-dec** from \`$old_version\` to \`$new_version\` using \`passthru.updateScript\`."

          if [[ -n "$commit_body" ]]; then
            body="$(printf '%s\n\n```\n%s\n```' "$body" "$commit_body")"
          fi

          jq -n \
            --arg base "$base" \
            --arg head "$head" \
            --arg title "$title" \
            --arg body "$body" \
            '{
              base: $base,
              head: $head,
              title: $title,
              body: $body
            }' |
          curl --fail-with-body "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/pulls" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            --data @-
